name: Attest wallet release
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      release: true
  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      # This job never checks out the source, installs dependencies or runs the wallet.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/chicory-web-linux-x64.tar.gz
          create-storage-record: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/chicory-web-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
