name: Wallet checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      artifact-id:
        value: ${{ jobs.verify.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package and start the standalone wallet
        run: |
          bash scripts/release/package.sh "$RUNNER_TEMP/chicory-web-linux-x64.tar.gz"
          node scripts/release/smoke.mjs "$RUNNER_TEMP/chicory-web-linux-x64.tar.gz"
      - name: Store release archive
        id: archive
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chicory-web-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chicory-web-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
